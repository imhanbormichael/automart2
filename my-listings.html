<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Listings - AutoMart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cars.css" />
  <style>
    .listings-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 16px 60px;
    }
    .listings-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .delete-btn {
      width: 100%;
      margin-top: 10px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: #ef4444;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .delete-btn:hover {
      background: #dc2626;
    }
    @media (max-width: 640px) {
      .listings-wrap {
        padding-top: 90px;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <div class="logo">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9L2.2 10.8A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
            <circle cx="7" cy="17" r="2"/>
            <circle cx="17" cy="17" r="2"/>
          </svg>
        </div>
        <span>Auto<span class="blue">Mart</span></span>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="cars.html">Cars</a>
        <a href="post-car.html">Post Car</a>
      </nav>
      <div class="auth">
        <a class="login" href="login.html">Login</a>
        <a class="signup" href="login.html">Sign Up</a>
      </div>
      <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu">
    <a href="index.html">Home</a>
    <a href="cars.html">Cars</a>
    <a href="post-car.html">Post Car</a>
    <div class="menu-divider"></div>
    <div class="mobile-auth">
      <a class="login" href="login.html">Login</a>
      <a class="signup" href="login.html">Sign Up</a>
    </div>
  </div>

  <section class="listings-wrap">
    <div class="listings-top">
      <div>
        <h1>My <span class="blue">Listings</span></h1>
        <p id="listings-count">Loading...</p>
      </div>
      <a href="post-car.html" class="view-details-btn" style="width:auto;padding:12px 18px;text-decoration:none;display:inline-block;">Post another car</a>
    </div>
    <div id="listings-grid" class="featured-grid"></div>
  </section>

  <script src="js/main.js"></script>
  <script type="module" src="js/my-listings.js"></script>
</body>
</html>
